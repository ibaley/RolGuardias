<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RolGuardias CPR ABC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">CPR ABC</p>
      <h1>Rol de Guardias</h1>
    </div>
    <div class="topbar__meta">
      <span id="periodLabel">Sin generar</span>
      <span id="totalRowsLabel">0 semanas</span>
    </div>
  </header>

  <main class="workspace">
    <section class="toolbar" aria-label="Configuracion">
      <label class="field">
        <span>Inicio</span>
        <input id="startDate" type="date">
      </label>
      <label class="field field--short">
        <span>Semanas</span>
        <input id="weekCount" type="number" min="1" max="104" step="1">
      </label>
      <label class="field field--grow">
        <span>Buscar</span>
        <input id="searchInput" type="search" autocomplete="off">
      </label>
      <div class="actions" aria-label="Acciones">
        <button id="generateButton" class="button button--primary" type="button">Generar</button>
        <button id="pdfButton" class="button" type="button">PDF tabla</button>
        <button id="calendarPdfButton" class="button" type="button">PDF calendario</button>
        <button id="csvButton" class="button" type="button">CSV</button>
        <button id="resetButton" class="button button--quiet" type="button">Reset</button>
      </div>
    </section>

    <section id="validationMessages" class="alerts" aria-live="polite"></section>

    <section class="rosters" aria-label="Listas por campus">
      <article class="roster-panel">
        <div class="panel-heading">
          <h2>Santa Fe</h2>
          <span id="santaFeCount">0</span>
        </div>
        <textarea id="santaFeRoster" class="roster-source" spellcheck="false" hidden></textarea>
        <div class="token-editor">
          <div class="token-add">
            <textarea id="santaFeAddInput" class="token-add__input" rows="2" spellcheck="false" placeholder="Pegar nombres"></textarea>
            <button id="santaFeAddButton" class="button" type="button">Agregar</button>
          </div>
          <ol id="santaFeTokens" class="token-list" aria-label="Integrantes Santa Fe"></ol>
        </div>
      </article>

      <article class="roster-panel">
        <div class="panel-heading">
          <h2>Observatorio</h2>
          <span id="observatorioCount">0</span>
        </div>
        <textarea id="observatorioRoster" class="roster-source" spellcheck="false" hidden></textarea>
        <div class="token-editor">
          <div class="token-add">
            <textarea id="observatorioAddInput" class="token-add__input" rows="2" spellcheck="false" placeholder="Pegar nombres"></textarea>
            <button id="observatorioAddButton" class="button" type="button">Agregar</button>
          </div>
          <ol id="observatorioTokens" class="token-list" aria-label="Integrantes Observatorio"></ol>
        </div>
      </article>
    </section>

    <section class="summary" aria-label="Distribucion">
      <article>
        <div class="panel-heading">
          <h2>Conteo Santa Fe</h2>
          <span id="santaFeAssignments">0</span>
        </div>
        <div id="santaFeSummary" class="summary-list"></div>
      </article>
      <article>
        <div class="panel-heading">
          <h2>Conteo Observatorio</h2>
          <span id="observatorioAssignments">0</span>
        </div>
        <div id="observatorioSummary" class="summary-list"></div>
      </article>
    </section>

    <section class="schedule" aria-label="Calendario generado">
      <div class="panel-heading schedule-heading">
        <div class="schedule-heading__title">
          <h2>Calendario</h2>
          <span id="visibleRowsLabel">0 visibles</span>
        </div>
        <div class="view-toggle" role="group" aria-label="Vista del calendario">
          <button id="tableViewButton" class="view-toggle__button is-active" type="button" aria-pressed="true">
            Tabla
          </button>
          <button id="monthViewButton" class="view-toggle__button" type="button" aria-pressed="false">
            Calendario
          </button>
        </div>
      </div>
      <div id="tableView" class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Fecha</th>
              <th>Santa Fe - 2do</th>
              <th>Santa Fe - 1er</th>
              <th>Observatorio - 2do</th>
              <th>Observatorio - 1er</th>
            </tr>
          </thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
      <div id="monthView" class="month-view" hidden></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
